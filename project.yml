name: PencilReader
options:
  bundleIdPrefix: com.christianrauso
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ReaderCore:
    path: ReaderCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: Q4XVF5LGAK
    CODE_SIGN_STYLE: Automatic

targets:
  PencilReader:
    type: application
    platform: iOS
    sources:
      - PencilReader
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christianrauso.PencilReader
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PencilReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "La fotocamera serve per scansionare le pagine dei libri."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
